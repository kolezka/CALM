[package]
name = "calm-native"
version.workspace = true
edition = "2024"

[dependencies]
calm-core = { path = "../calm-core" }
raw-window-handle = { workspace = true }
block2 = { workspace = true }
# Same version as calm-app and gpui-pre. A full PNG decode, since NSImage loads lazily.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSDate",
    "NSError",
    "NSURLAuthenticationChallenge",
    "NSURLCredential",
    "NSURLSession",
    "NSValue",
    "NSEnumerator",
    "NSGeometry",
    "NSObject",
    "NSPathUtilities",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLRequest",
] }
objc2-app-kit = { workspace = true, default-features = false, features = [
    "std",
    "NSActionCell",
    "block2",
    "NSApplication",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSColorWell",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSParagraphStyle",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScrollView",
    "NSSlider",
    "NSTabView",
    "NSTabViewItem",
    "NSText",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-quartz-core = { workspace = true, default-features = false, features = [
    "std",
    "CALayer",
    "CAShapeLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
# CGPath for the occlusion mask's shape.
objc2-core-graphics = { workspace = true, default-features = false, features = [
    "std",
    "CGPath",
] }
objc2-web-kit = { workspace = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKUIDelegate",
    "WKWindowFeatures",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
] }
