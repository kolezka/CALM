name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      dry_run:
        description: Build the source tarball as a workflow artifact, but do not commit, tag or release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, calm]
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Release runs only from main, got $REF"
            exit 1
          fi

  # Portable crates only: the app does not build on Linux yet.
  # Both jobs check out github.sha, the main commit the run was dispatched on.
  linux-arch:
    needs: guard
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, calm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Test portable crates in Arch
        run: scripts/ci-arch.sh test

  # Runs on the Linux runner because hosted macOS minutes are unavailable. The app does not
  # build on Linux, so the release carries a source tarball. The macOS zip is built on a Mac
  # and attached with scripts/release-upload.sh. See docs/release.md.
  release:
    needs: [guard, linux-arch]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, calm]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # The runner image may not ship gh. Install a pinned release into this job's temp
      # directory. The hash is copied from gh_<version>_checksums.txt of that release.
      - name: Install gh if missing
        env:
          GH_CLI_VERSION: 2.103.3
          GH_CLI_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then
            gh --version
            exit 0
          fi
          for tool in curl sha256sum tar; do
            command -v "$tool" >/dev/null || { echo "::error::gh is missing and so is $tool, cannot install gh"; exit 1; }
          done
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::gh is missing and the runner is $(uname -m), not x86_64"; exit 1; }
          name="gh_${GH_CLI_VERSION}_linux_amd64"
          base="https://github.com/cli/cli/releases/download/v$GH_CLI_VERSION"
          dir="$RUNNER_TEMP/gh"
          mkdir -p "$dir"
          cd "$dir"
          if ! curl -fsSLO "$base/$name.tar.gz" || ! curl -fsSLO "$base/gh_${GH_CLI_VERSION}_checksums.txt"; then
            echo "::error::gh is not installed on the runner and downloading gh $GH_CLI_VERSION failed"
            exit 1
          fi
          grep " $name.tar.gz\$" "gh_${GH_CLI_VERSION}_checksums.txt" | sha256sum -c -
          echo "$GH_CLI_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          echo "$dir/$name/bin" >>"$GITHUB_PATH"
          "$dir/$name/bin/gh" --version

      - name: Check runner tools
        run: |
          set -euo pipefail
          missing=0
          for tool in git gh tar gzip sha256sum curl; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is not installed on the runner"
              missing=1
            fi
          done
          exit "$missing"

      # scripts/bump-version.sh runs cargo update to refresh Cargo.lock. The runner image has
      # no Rust, so install a minimal toolchain into this job's temp directory when needed.
      - name: Install Rust if missing
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null; then
            cargo --version
            exit 0
          fi
          export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          {
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_HOME=$CARGO_HOME"
          } >>"$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >>"$GITHUB_PATH"
          "$CARGO_HOME/bin/cargo" --version

      # Decides between a new release and resuming one whose tag was pushed but whose
      # release was never created. See docs/release.md, "Recovering a failed release".
      - name: Plan version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Without this, a failure inside $(classify ...) would not stop the function.
          shopt -s inherit_errexit

          # Prints free, resume, released, draft or mismatch for tag v<version>.
          classify() {
            local version="$1" tag="v$1" rc=0 out tagged
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo free
              return
            elif [ "$rc" -ne 0 ]; then
              echo "::error::git ls-remote for $tag failed with rc=$rc" >&2
              return 1
            fi
            git fetch --quiet --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
            git show "refs/tags/$tag^{commit}:Cargo.toml" >"$RUNNER_TEMP/tag-Cargo.toml"
            tagged="$(scripts/bump-version.sh --current "$RUNNER_TEMP/tag-Cargo.toml")"
            if out="$(gh release view "$tag" --json isDraft --jq .isDraft 2>&1)"; then
              if [ "$out" = "true" ]; then echo draft; else echo released; fi
            elif [ "$out" != "release not found" ]; then
              echo "::error::gh release view $tag failed: $out" >&2
              return 1
            elif [ "$tagged" = "$version" ]; then
              echo resume
            else
              echo mismatch
            fi
          }

          resume() {
            # Undo any local bump and build exactly the tagged commit.
            git checkout -- Cargo.toml Cargo.lock
            git checkout --quiet --detach "refs/tags/v$1"
            echo "mode=resume" >>"$GITHUB_OUTPUT"
            echo "version=$1" >>"$GITHUB_OUTPUT"
            echo "Resuming v$1: tag exists on origin without a release."
          }

          # A new dispatch after a failed release: main already carries the tagged version.
          current="$(scripts/bump-version.sh --current)"
          state="$(classify "$current")"
          if [ "$state" = "resume" ]; then
            resume "$current"
            exit 0
          elif [ "$state" = "draft" ]; then
            echo "::error::A draft release v$current exists. Delete it (gh release delete v$current) and run again."
            exit 1
          fi

          version="$(scripts/bump-version.sh "$BUMP")"
          state="$(classify "$version")"
          case "$state" in
            free)
              echo "mode=new" >>"$GITHUB_OUTPUT"
              echo "version=$version" >>"$GITHUB_OUTPUT"
              echo "New version: $version"
              git diff --stat
              ;;
            resume)
              # A rerun of a failed run: same dispatch commit, same bump, tag already pushed.
              resume "$version"
              ;;
            released)
              echo "::error::Tag v$version already exists and has a release. Nothing to resume."
              exit 1
              ;;
            draft)
              echo "::error::A draft release v$version exists. Delete it (gh release delete v$version) and run again."
              exit 1
              ;;
            *)
              echo "::error::Tag v$version already exists on origin but its Cargo.toml version differs. Refusing to release."
              exit 1
              ;;
          esac

      - name: Commit and tag
        if: ${{ !inputs.dry_run && steps.plan.outputs.mode == 'new' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "CALM v$VERSION"

      # A real release archives the tag. A dry run has no tag yet, so it archives the
      # dispatched commit under the same name.
      - name: Source tarball
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then ref="$SHA"; else ref="v$VERSION"; fi
          name="CALM-$VERSION-source.tar.gz"
          mkdir -p dist
          git archive --format=tar.gz --prefix="CALM-$VERSION/" -o "dist/$name" "$ref"
          (cd dist && sha256sum "$name" >"$name.sha256")
          echo "Archived $ref:"
          ls -l "dist/$name" "dist/$name.sha256"
          cat "dist/$name.sha256"

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: CALM-${{ steps.plan.outputs.version }}-source
          path: |
            dist/CALM-*-source.tar.gz
            dist/CALM-*-source.tar.gz.sha256
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "resume" ]; then
            what="create release v$VERSION from the existing tag"
          else
            what="commit 'chore(release): v$VERSION' on main, tag v$VERSION and create release v$VERSION"
          fi
          echo "Dry run: would $what with CALM-$VERSION-source.tar.gz and its .sha256."
          {
            echo "### Dry run ($MODE)"
            echo "Would $what. Source tarball uploaded as a workflow artifact."
          } >>"$GITHUB_STEP_SUMMARY"

      # No force: if main moved since the dispatch, the push is rejected and nothing is tagged.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run && steps.plan.outputs.mode == 'new' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Create release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --verify-tag \
            --title "CALM v$VERSION" \
            --notes "macOS bundle: built and uploaded locally with \`scripts/release-upload.sh $VERSION\`" \
            --generate-notes \
            "dist/CALM-$VERSION-source.tar.gz" \
            "dist/CALM-$VERSION-source.tar.gz.sha256"
