name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      dry_run:
        description: Build and upload the zip as a workflow artifact, but do not commit, tag or release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.16.0

jobs:
  guard:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, calm]
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Release runs only from main, got $REF"
            exit 1
          fi

  # Portable crates only: the app does not build on Linux yet.
  # Both jobs check out github.sha, the main commit the run was dispatched on.
  linux-arch:
    needs: guard
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, calm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Test portable crates in Arch
        run: scripts/ci-arch.sh test

  release:
    needs: [guard, linux-arch]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/macos-toolchain

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}-zig-${{ env.ZIG_VERSION }}
          restore-keys: macos-cargo-

      # Decides between a new release and resuming one whose tag was pushed but whose
      # release was never created. See docs/release.md, "Recovering a failed release".
      - name: Plan version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Without this, a failure inside $(classify ...) would not stop the function.
          shopt -s inherit_errexit

          # Prints free, resume, released, draft or mismatch for tag v<version>.
          classify() {
            local version="$1" tag="v$1" rc=0 out tagged
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo free
              return
            elif [ "$rc" -ne 0 ]; then
              echo "::error::git ls-remote for $tag failed with rc=$rc" >&2
              return 1
            fi
            git fetch --quiet --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
            git show "refs/tags/$tag^{commit}:Cargo.toml" >"$RUNNER_TEMP/tag-Cargo.toml"
            tagged="$(scripts/bump-version.sh --current "$RUNNER_TEMP/tag-Cargo.toml")"
            if out="$(gh release view "$tag" --json isDraft --jq .isDraft 2>&1)"; then
              if [ "$out" = "true" ]; then echo draft; else echo released; fi
            elif [ "$out" != "release not found" ]; then
              echo "::error::gh release view $tag failed: $out" >&2
              return 1
            elif [ "$tagged" = "$version" ]; then
              echo resume
            else
              echo mismatch
            fi
          }

          resume() {
            # Undo any local bump and build exactly the tagged commit.
            git checkout -- Cargo.toml Cargo.lock
            git checkout --quiet --detach "refs/tags/v$1"
            echo "mode=resume" >>"$GITHUB_OUTPUT"
            echo "version=$1" >>"$GITHUB_OUTPUT"
            echo "Resuming v$1: tag exists on origin without a release."
          }

          # A new dispatch after a failed release: main already carries the tagged version.
          current="$(scripts/bump-version.sh --current)"
          state="$(classify "$current")"
          if [ "$state" = "resume" ]; then
            resume "$current"
            exit 0
          elif [ "$state" = "draft" ]; then
            echo "::error::A draft release v$current exists. Delete it (gh release delete v$current) and run again."
            exit 1
          fi

          version="$(scripts/bump-version.sh "$BUMP")"
          state="$(classify "$version")"
          case "$state" in
            free)
              echo "mode=new" >>"$GITHUB_OUTPUT"
              echo "version=$version" >>"$GITHUB_OUTPUT"
              echo "New version: $version"
              git diff --stat
              ;;
            resume)
              # A rerun of a failed run: same dispatch commit, same bump, tag already pushed.
              resume "$version"
              ;;
            released)
              echo "::error::Tag v$version already exists and has a release. Nothing to resume."
              exit 1
              ;;
            draft)
              echo "::error::A draft release v$version exists. Delete it (gh release delete v$version) and run again."
              exit 1
              ;;
            *)
              echo "::error::Tag v$version already exists on origin but its Cargo.toml version differs. Refusing to release."
              exit 1
              ;;
          esac

      # Pushes made with GITHUB_TOKEN do not trigger ci.yml, so the full checks run here.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit and tag
        if: ${{ !inputs.dry_run && steps.plan.outputs.mode == 'new' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "CALM v$VERSION"

      - name: Build bundle
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: scripts/bundle-macos.sh "$VERSION" dist

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: CALM-${{ steps.plan.outputs.version }}-macos-arm64
          path: |
            dist/CALM-*-macos-arm64.zip
            dist/CALM-*-macos-arm64.zip.sha256
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "resume" ]; then
            what="create release v$VERSION from the existing tag"
          else
            what="commit 'chore(release): v$VERSION' on main, tag v$VERSION and create release v$VERSION"
          fi
          echo "Dry run: would $what with:"
          ls -l dist/CALM-"$VERSION"-macos-arm64.zip dist/CALM-"$VERSION"-macos-arm64.zip.sha256
          {
            echo "### Dry run ($MODE)"
            echo "Would $what. Zip uploaded as a workflow artifact."
          } >>"$GITHUB_STEP_SUMMARY"

      # No force: if main moved since the dispatch, the push is rejected and nothing is tagged.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run && steps.plan.outputs.mode == 'new' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Create release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --verify-tag \
            --title "CALM v$VERSION" \
            --generate-notes \
            "dist/CALM-$VERSION-macos-arm64.zip" \
            "dist/CALM-$VERSION-macos-arm64.zip.sha256"
