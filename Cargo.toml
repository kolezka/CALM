[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.4" }
# gpui-pre has no Application::new; the macOS platform lives here. font-kit enables text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit"] }
gpui-libghostty = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
